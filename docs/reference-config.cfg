[Features]

## Twitch: Twitch chat and events through the companion bridge or anonymous IRC; optional mock audience.
# Setting type: Boolean
# Default value: true
Twitch = true

## Audience engine: Interaction engine, moderation and chat commands shared by voting, naming, guessing and the Twitch opponent.
# Setting type: Boolean
# Default value: true
Audience = true

## Community answer voting: Chat votes on the current question; show the result or submit it for the human player.
# Setting type: Boolean
# Default value: true
Voting = true

## Community naming: Chat suggests and selects names for contestants and teams.
# Setting type: Boolean
# Default value: true
Naming = true

## Community guessing: Chat guesses answers, the winning team or the prize money; correct guesses earn points.
# Setting type: Boolean
# Default value: true
Guessing = true

## Twitch opponent: The audience plays the game's bot contestant (crowd, chat team, selected/rotating viewer, hybrid).
# Setting type: Boolean
# Default value: true
TwitchOpponent = true

## Who wins? bets: Twitch prediction and chat bet on the winner: streamer, AI, Twitch viewer or player 2.
# Setting type: Boolean
# Default value: true
WhoWins = true

## Event bindings: Rules mapping Twitch/game events to audience actions (bindings.json).
# Setting type: Boolean
# Default value: true
Bindings = true

## Statistics: Local audience and game statistics (optional persistence, never transmitted).
# Setting type: Boolean
# Default value: true
Statistics = true

## Overlay: Control panel (F8) for status, audience moderation, features and events.
# Setting type: Boolean
# Default value: true
Overlay = true

## Debug tools: Test actions: programmatic shows, automatic decisions, auto-quit. Off unless configured.
# Setting type: Boolean
# Default value: true
DebugTools = true

## Game settings: Volumes (applied at start, real mute), resolution, window mode, frame rate, vsync, quality.
# Setting type: Boolean
# Default value: true
GameSettings = true

## Skip intro: Skip the startup logos and (optionally) the show intro and the tutorial question.
# Setting type: Boolean
# Default value: true
SkipIntro = true

## Quickplay: Start shows with a configured line-up instead of the team and character selection.
# Setting type: Boolean
# Default value: true
Quickplay = true

## Mouse support: Visible cursor; clicks, hover and wheel work on every screen through the game's own input.
# Setting type: Boolean
# Default value: true
Mouse = true

## Keyboard shortcuts: Enter/Space confirm, 1-3 answers, 1-5 master bets for the keyboard player in a show.
# Setting type: Boolean
# Default value: true
Keyboard = true

## Vote window: Game-styled, movable vote window for audience interactions (F9).
# Setting type: Boolean
# Default value: true
VoteHud = true

## Notifications: Toasts for Twitch connection, login code and the current Twitch opponent.
# Setting type: Boolean
# Default value: true
Notifications = true

## ESC menu: Escape opens a menu with resume, save, settings, mod menu, main menu and quit.
# Setting type: Boolean
# Default value: true
EscMenu = true

## Mod menu: In-game menu for game settings, Twitch, audience and all mod settings (F10).
# Setting type: Boolean
# Default value: true
ModMenu = true

## Mods self-test: Unattended runtime check of the mod menus, quickplay and mouse presses (testing only).
# Setting type: Boolean
# Default value: false
