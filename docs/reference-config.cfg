## Mark the tutorial as played so the first show does not ask for it (still available from the archive).
# Setting type: Boolean
# Default value: false
NoTutorialPrompt = false

[Statistics]

## Keep statistics across sessions in BepInEx/wwds/statistics.json (local only).
# Setting type: Boolean
# Default value: true
SaveToDisk = true

[Twitch]

## Off | Bridge | Irc | BridgeWithIrcFallback | Mock. Bridge needs WWDS.Bridge running; Irc is anonymous read-only chat.
# Setting type: TwitchMode
# Default value: Off
# Acceptable values: Off, Bridge, Irc, BridgeWithIrcFallback, Mock
Mode = Off

## Channel login for the IRC fallback (the bridge uses its own configuration).
# Setting type: String
# Default value: 
Channel = 

## Localhost port of WWDS.Bridge.
# Setting type: Int32
# Default value: 47321
BridgePort = 47321

## Prefix of chat commands.
# Setting type: String
# Default value: !
CommandPrefix = !

## Comma separated logins treated as moderators by the harness.
# Setting type: String
# Default value: 
TrustedUsers = 

## Real Twitch test mode: commands are parsed and logged, but audience-driven game actions and chat replies are NOT applied. Mock mode is never gated.
# Setting type: Boolean
# Default value: true
TestMode = true

## Minimum seconds between two chat messages sent by the harness.
# Setting type: Single
# Default value: 2
ChatMinIntervalSeconds = 2

## Post interaction results (vote winners, chosen names) in chat.
# Setting type: Boolean
# Default value: true
AnnounceInChat = true

## Start the bundled WWDS.Bridge invisibly when Mode uses the bridge (needed for in-game login).
# Setting type: Boolean
# Default value: true
AutoStartBridge = true

## Path to WWDS.Bridge.exe (empty = BepInEx/plugins/WWDS/bridge/WWDS.Bridge.exe).
# Setting type: String
# Default value: 
BridgePath = 

[UI]

## Key that toggles the control panel (UnityEngine.KeyCode name).
# Setting type: String
# Default value: F8
PanelHotkey = F8

## Size of the F8 control panel (0.75 to 2).
# Setting type: Single
# Default value: 1
PanelScale = 1

## Mark the correct answer in the panel (spoiler on stream!).
# Setting type: Boolean
# Default value: false
ShowCorrectAnswerInPanel = false

## Open the control panel at startup.
# Setting type: Boolean
# Default value: false
StartOpen = false

## Test aid: switch panel tabs every N seconds (0 = off).
# Setting type: Single
# Default value: 0
DebugCycleTabsSeconds = 0

## Size of the mod menus (0.6 to 1.4; capped so a menu always fits the screen).
# Setting type: Single
# Default value: 1
MenuScale = 1

## Size of the vote window (0.5 to 2).
# Setting type: Single
# Default value: 1
HudScale = 1

## Short notifications at the top of the screen (saved, Twitch connected, login code, ...).
# Setting type: Boolean
# Default value: true
Toasts = true

## Key that toggles the stream HUD.
# Setting type: String
# Default value: F9
HudHotkey = F9

## Show the HUD automatically while an audience interaction runs.
# Setting type: Boolean
# Default value: true
AutoShowHud = true

[Voting]

## Off | HumanTurns | AllQuestions.
# Setting type: VoteAutoOpen
# Default value: HumanTurns
# Acceptable values: Off, HumanTurns, AllQuestions
AutoOpen = HumanTurns

## ShowOnly | Assist (submit the majority for the human; needs Twitch TestMode = false).
# Setting type: VoteMode
# Default value: ShowOnly
# Acceptable values: ShowOnly, Assist
Mode = ShowOnly

## Seconds a vote stays open on normal questions.
# Setting type: Single
# Default value: 25
VoteDuration = 25

## Seconds on the master question (game clock is 20 s).
# Setting type: Single
# Default value: 12
MasterVoteDuration = 12

## Viewers may change their vote while it is open.
# Setting type: Boolean
# Default value: true
VoteChanging = true

## Votes needed for a valid result.
# Setting type: Int32
# Default value: 1
MinimumVotes = 1

## Random | First | Fallback | Moderator | Revote.
# Setting type: TieBreak
# Default value: Random
# Acceptable values: Random, First, Fallback, Moderator, Revote
TieBreakMethod = Random

## Post the final breakdown in chat.
# Setting type: Boolean
# Default value: true
ShowBreakdownInChat = true

## Majority | WeightedRandom (pick randomly, proportional to the votes).
# Setting type: VoteResolution
# Default value: Majority
# Acceptable values: Majority, WeightedRandom
Resolution = Majority

## Also start a native Twitch poll; its result decides when it ends first (affiliate/partner only).
# Setting type: Boolean
# Default value: false
UseTwitchPolls = false

[WhoWins]

## Start a channel-points prediction on the winner at show start (affiliate/partner; spends viewers' channel points).
# Setting type: Boolean
# Default value: false
TwitchPrediction = false

## Chat bets on the winner with !vote A/B (leaderboard points).
# Setting type: Boolean
# Default value: true
ChatBets = true

## Seconds the bet stays open.
# Setting type: Int32
# Default value: 120
WindowSeconds = 120

## Label of the first local player.
# Setting type: String
# Default value: Streamer
StreamerLabel = Streamer

## Label prefix of further local players ("Spieler 2").
# Setting type: String
# Default value: Spieler
PlayerLabel = Spieler

## Label of the game's AI contestant.
# Setting type: String
# Default value: KI
AiLabel = KI

## Label of the audience-controlled contestant.
# Setting type: String
# Default value: Twitch
TwitchLabel = Twitch

