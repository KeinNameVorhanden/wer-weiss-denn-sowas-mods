## Settings file was created by plugin WWDS Harness v0.11.0
## Plugin GUID: wwds.harness

[Adapter]

## Seconds an externally controlled bot waits for a normal-question decision before it picks randomly (the game has no timer here).
# Setting type: Single
# Default value: 90
AnswerDecisionTimeout = 90

## Seconds for a master-question decision. The game's clock is 20 s; keep a safety margin.
# Setting type: Single
# Default value: 16
MasterDecisionTimeout = 16

## Seconds for a master bet decision before the game's bot logic decides.
# Setting type: Single
# Default value: 30
BetDecisionTimeout = 30

## Seconds for a bonus estimate decision before the game's bot logic decides.
# Setting type: Single
# Default value: 45
EstimateDecisionTimeout = 45

## Seconds for a category decision before a random open category is picked.
# Setting type: Single
# Default value: 30
CategoryDecisionTimeout = 30

[Audience]

## Chat command(s) for votes, comma separated (first is primary).
# Setting type: String
# Default value: vote,answer
VoteCommand = vote,answer

## Chat command for name suggestions.
# Setting type: String
# Default value: name
NameCommand = name

## Chat command for guesses.
# Setting type: String
# Default value: guess
GuessCommand = guess

